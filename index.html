<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>สมุดเงินเดือน T/C:A</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Bai Jamjuree',system-ui,sans-serif; --body:'IBM Plex Sans Thai',system-ui,sans-serif;
  --bg:#f1f0ec; --surface:#fff; --surface-2:#f6f5f1; --fg:#1d1b17; --muted:#6a655b; --line:#ddd9cf;
  --accent:#9a4a12; --accent-ink:#fff; --accent-soft:#f6e6d8; --good:#2f7a3e; --bad:#b3261e; --warn:#8a5a00;
  --hero:#2a211a; --hero-fg:#fbf4ec; --hero-muted:#cbb9a6; --hero-line:#4a3b2f;
  --r15:#d4884a; --r2:#a8541a; --r3:#66290a; --night:#4b4f9a; --vac:#0f8f80; --per:#8a5ad8; --sick:#c9a000; --abs:#b3261e; --hol:#d0342c;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141210; --surface:#1d1a17; --surface-2:#24201c; --fg:#efe9e1; --muted:#a69d91; --line:#352f29;
    --accent:#f0a46a; --accent-ink:#2a1606; --accent-soft:#3a2617; --good:#7fd08f; --bad:#ff8f87; --warn:#f3c26b;
    --hero:#2b1f15; --hero-fg:#fbf4ec; --hero-muted:#c9b39c; --hero-line:#4a3a2c;
    --r15:#b05f25; --r2:#ec9c55; --r3:#ffe0c2; --night:#9da3ff; --vac:#3cc9b5; --per:#b08cff; --sick:#f2c94c; --abs:#ff8f87; --hol:#ff6b62}
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:14px 14px 110px;display:grid;gap:12px}
.demo{background:#fff4d6;color:#6b4a00;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;font-size:13px}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:16px;display:grid;gap:8px}
.eyebrow{font:600 14px var(--display);color:var(--hero-muted);display:flex;justify-content:space-between;gap:8px}
.hero-amount{font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums}
.hero-sub{font-size:13px;color:var(--hero-muted)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:10px}
.hero-stats span{display:block;font-size:12px;color:var(--hero-muted)}
.hero-stats b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 2px;min-height:46px;color:var(--muted);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h2{font:600 17px var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:400 13px var(--body);color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:14px}
.warn{color:var(--warn)} .bad{color:var(--bad)} .good{color:var(--good)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row span:last-child,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.line{border-top:1px solid var(--line);padding-top:8px}
.total{font:600 16px var(--display)}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.datebox{position:relative;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.step{display:flex;justify-content:space-between;align-items:center;gap:10px}
.step small{display:block;color:var(--muted);font-size:12px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;cursor:pointer}
.ctl output{min-width:56px;text-align:center;font:600 20px var(--display)}
.ctl output small{font:400 12px var(--body);color:var(--muted);margin-left:2px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:500}
.field input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2);text-align:right;font-variant-numeric:tabular-nums}
.field small{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.cal button.today{border:2px solid var(--accent)}
.cal button.we{color:var(--muted)}
.cal button.hol{color:var(--hol)}
.cal button.off{visibility:hidden}
.cal i{display:flex;gap:2px;height:6px}
.cal i b{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.quota{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quota div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.quota b{display:block;font:700 24px var(--display)}
.quota span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .t{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex}
.bar .t b{height:100%}
.xi{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;align-items:center}
.xi input{min-height:40px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface-2);min-width:0}
.xi input.amt{text-align:right}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:9}
.foot .btn{flex:1;max-width:320px}
.hidden{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.status{display:flex;gap:10px;align-items:center}
.status .dot{width:12px;height:12px;border-radius:50%;flex:none}
.list{display:grid;gap:2px}
.list button{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:9px 2px;text-align:left;cursor:pointer;width:100%}
.list button:first-child{border-top:0}
.block{padding:40px 16px;text-align:center;display:grid;gap:10px}
.cal button.selh{background:color-mix(in srgb,var(--hol) 18%,var(--surface));border-color:var(--hol);color:var(--hol);font-weight:600}
.cal button.selw{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good);color:var(--good);font-weight:600}
.mrow{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:14px}
.mrow input{min-height:40px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface-2);min-width:0}
.mrow input[type=number]{text-align:right}
</style>
</head>
<body>
<main id="app"></main>
<div class="foot hidden"><button class="btn danger hidden" id="del"></button><button class="btn primary" id="go"></button></div>
<script>
'use strict';
const tg = window.Telegram && Telegram.WebApp;
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_DOW = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_DOWL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const LV = {vac: 'พักร้อน', sick: 'ลาป่วย', per: 'ลากิจ', abs: 'ขาดงาน'};
const LVI = {vac: '🏖', sick: '🤒', per: '📝', abs: '❌'};
const QUOTA = {per: 3, sick: 30};
const pad = n => String(n).padStart(2, '0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoD(d); };
const thd = s => { const d = parse(s); return `${TH_DOW[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]}`; };
const thdl = s => { const d = parse(s); return `${TH_DOWL[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]}`; };
const thk = k => { const [y, m] = k.split('-').map(Number); return `${TH_MON[m - 1]} ${String(y + 543).slice(2)}`; };
const money = (v, dp = 2) => Number(v || 0).toLocaleString('en-US', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mkey = (y, m) => { const d = new Date(y, m - 1, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const keyOf = s => { const d = parse(s); return d.getDate() >= 16 ? mkey(d.getFullYear(), d.getMonth() + 2) : mkey(d.getFullYear(), d.getMonth() + 1); };
const period = k => { const [y, m] = k.split('-').map(Number); return [isoD(new Date(y, m - 2, 16)), isoD(new Date(y, m - 1, 15))]; };
const hm = h => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };

/* ---------- ข้อมูลที่บอทแนบมากับปุ่ม (หลัง # ไม่ถูกส่งไปที่เว็บ) · ไม่มี = เปิดนอกบอท ใช้ไม่ได้ ---------- */
let D = null;
try {
  const h = location.hash.slice(1) || window.PREVIEW_HASH || '';
  if (h) { const b = atob(h.replace(/-/g, '+').replace(/_/g, '/')); D = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))); }
} catch (e) { D = null; }
const inTg = () => !!(tg && typeof tg.sendData === 'function' && tg.platform && tg.platform !== 'unknown');
const PREVIEW = !!window.PREVIEW;            // หน้าทดลองในแชตกับ Claude เท่านั้น (ไม่มีบน GitHub)
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
if (!D || (!inTg() && !PREVIEW)) {
  document.getElementById('app').innerHTML = `<section class="panel block"><h2 style="justify-content:center">📒 สมุดเงินเดือน</h2><p>เปิดจากปุ่ม <b>📒 ข้อมูล</b> หรือ <b>⚙️ ตั้งค่า</b> ในแชตบอทผู้ช่วยเท่านั้น</p><p class="hint">หน้านี้ไม่มีข้อมูลของใคร ข้อมูลของแต่ละคนบอทแนบมาให้ตอนกดปุ่ม</p></section>`;
  throw new Error('stop');
}
const ADM = !!D.adm;
const today = D.t || isoD(new Date());

function send(obj) {
  if (PREVIEW) { alert('ทดลอง: จะส่งเข้าบอทเป็น\n' + JSON.stringify(obj)); return; }
  if (!inTg()) { alert('เปิดจากปุ่มในแชตบอทผู้ช่วยก่อนนะครับ'); return; }
  try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  try { tg.sendData(JSON.stringify(obj)); }
  catch (e) { alert('ส่งไม่ได้ · เปิดจากปุ่มคีย์บอร์ดด้านล่างแชตส่วนตัวกับบอท (ไม่ใช่ลิงก์หรือปุ่ม Menu) แล้วลองใหม่'); }
}
const foot = (txt, opt = {}) => {
  const f = document.querySelector('.foot'), go = document.getElementById('go'), del = document.getElementById('del');
  f.classList.toggle('hidden', !txt); go.textContent = txt || ''; go.disabled = !!opt.disabled;
  del.classList.toggle('hidden', !opt.del); del.textContent = opt.del || '';
};

/* ======================= สมุดของสมาชิก ======================= */
if (!ADM) {
const S = Object.assign({sal: 0, dil: 1000, sh: 220, inc: 0, sso: 0, tax: 0, oth: 0, vq: 13, auto: 1}, D.s || {});
const OT = D.o || {};                 // {iso: [ชม.1.5, 2, 3, กะดึก]}
const LVS = D.l || {};                // {iso: [ประเภท, 1|0.5]}
const HOL = new Set(D.h || []), WK = new Set(D.wk || []);
const X = Object.assign({inc: [], ded: []}, D.x || {});
const HIST = D.hist || [];
const KEY = D.k || keyOf(today), [PA, PB] = period(KEY), PAY = D.pay || '', BN = +D.bn || 0;
const rate = S.sal ? S.sal / 21 / 8.5 : 0;
const P0 = new URLSearchParams(location.search).get('m');
const st = {tab: ['today', 'days', 'dash', 'pay', 'set'].includes(P0) ? P0 : 'today', sub: 'ot',
  edit: false, d: today, h: [0, 0, 0], n: false, t: '', f: 1, xi: X.inc.map(r => r.slice()), xd: X.ded.map(r => r.slice())};
const isHol = s => HOL.has(s) || ([0, 6].includes(parse(s).getDay()) && !WK.has(s));
function loadDay() {
  const o = OT[st.d]; st.h = o ? [o[0], o[1], o[2]] : [0, 0, 0]; st.n = !!(o && o[3]);
  const l = LVS[st.d]; st.t = l ? l[0] : ''; st.f = l ? l[1] : 1;
}
loadDay();
const cleanX = a => a.map(r => [String(r[0] || '').trim().slice(0, 40), Math.round((parseFloat(String(r[1]).replace(/,/g, '')) || 0) * 100) / 100]).filter(r => r[1] > 0);
const xChanged = () => JSON.stringify([cleanX(st.xi), cleanX(st.xd)]) !== JSON.stringify([X.inc, X.ded]);

/* สลิปรอบนี้ (สูตรเดียวกับบอท) */
function slip() {
  let h15 = 0, h2 = 0, h3 = 0, nights = 0;
  for (const [d, v] of Object.entries(OT)) if (d >= PA && d <= PB) { h15 += v[0]; h2 += v[1]; h3 += v[2]; nights += v[3] ? 1 : 0; }
  const ot = rate * (1.5 * h15 + 2 * h2 + 3 * h3);
  const [y, m] = KEY.split('-').map(Number), pm = mkey(y, m - 1);
  const lost = [...new Set(Object.entries(LVS).filter(([d, v]) => d.startsWith(pm) && v[0] !== 'vac').map(([, v]) => LV[v[0]]))];
  const absd = Object.entries(LVS).filter(([d, v]) => d >= PA && d <= PB && v[0] === 'abs').reduce((a, [, v]) => a + v[1], 0);
  const inc = [['เงินเดือน', S.sal], ['โอที', ot], ['ค่ากะดึก', nights * S.sh], ['เบี้ยขยัน', lost.length ? 0 : S.dil], ['รายรับประจำอื่น ๆ', S.inc]];
  if (BN) inc.push([`โบนัส ${BN} เดือน`, S.sal * BN, 'b']);
  cleanX(st.xi).forEach(r => inc.push([r[0] || 'รายรับพิเศษ', r[1], 'x']));
  const ded = [['ภาษี (ตามสลิป)', S.tax], ['ประกันสังคม', S.sso], ['หักประจำอื่น ๆ', S.oth], ['ขาดงาน (ไม่ได้รับเงิน)', S.sal / 30 * absd]];
  cleanX(st.xd).forEach(r => ded.push([r[0] || 'รายการหักพิเศษ', r[1], 'x']));
  const ti = inc.reduce((a, r) => a + r[1], 0), td = ded.reduce((a, r) => a + r[1], 0);
  return {inc, ded, ti, td, net: ti - td, ot, h: [h15, h2, h3], nights, lost, pm};
}
function hero(p) {
  return `<section class="hero">
    <div class="eyebrow"><span>เงินเดือน ${thk(KEY)} (ประมาณ)</span><span>${PAY ? 'เงินออก ' + thd(PAY) : ''}</span></div>
    <div class="hero-amount">฿${money(p.net)}</div>
    <div class="hero-sub">รอบ ${thd(PA)} – ${thd(PB)}${S.sal ? '' : ' · ยังไม่ได้ใส่เงินเดือน'}</div>
    <div class="hero-stats"><div><span>โอทีรอบนี้</span><b>${hm(p.h[0] + p.h[1] + p.h[2])} ชม.</b></div><div><span>เงินโอที</span><b>฿${money(p.ot, 0)}</b></div><div><span>กะดึก</span><b>${p.nights} คืน</b></div></div>
  </section>`;
}
function dateCard() {
  const y = add(today, -1);
  return `<div class="chips"><button class="chip ${st.d === today ? 'on' : ''}" data-d="${today}">วันนี้</button><button class="chip ${st.d === y ? 'on' : ''}" data-d="${y}">เมื่อวาน</button></div>
    <label class="datebox"><span>📅 ${thdl(st.d)}</span><small class="hint">เปลี่ยนวัน ▾</small><input type="date" id="pick" value="${st.d}" min="${add(PA, -45)}" max="${add(today, 40)}"></label>
    ${isHol(st.d) ? `<div class="hint">🔸 ${HOL.has(st.d) ? 'วันหยุดบริษัท' : 'วันเสาร์-อาทิตย์'} — เวลาปกติเป็น 2 เท่า โอทีเป็น 3 เท่า</div>` : WK.has(st.d) ? '<div class="hint">🛠 วันทำงาน (บริษัทกำหนด)</div>' : ''}
    ${st.d < PA || st.d > PB ? `<div class="hint">วันนี้อยู่รอบ ${thk(keyOf(st.d))}</div>` : ''}`;
}
function homeView(p) {
  const w = D.w, WL = (D.wl || []).slice().reverse();
  const otTxt = o => o && (o[0] || o[1] || o[2]) ? [['1.5', o[0]], ['2', o[1]], ['3', o[2]]].filter(x => x[1]).map(x => `${x[0]}×${hm(x[1])}`).join(' · ') : 'ไม่มีโอที';
  return hero(p)
    + (S.sal ? '' : `<div class="note">ยังไม่ได้ใส่เงินเดือน กดแท็บ <b>ตั้งค่า</b> ก่อน บอทถึงคิดเป็นเงินได้</div>`)
    + `<section class="panel clock"><div class="status"><span class="dot" style="background:${w ? 'var(--good)' : 'var(--line)'}"></span>
        <b style="font-size:18px">${w ? `ทำงานอยู่ · เข้า ${w.slice(11)}${w.slice(0, 10) !== today ? ' (' + thd(w.slice(0, 10)) + ')' : ''}` : 'ยังไม่ได้เข้างาน'}</b></div>
        <div>${w ? 'เลิกงานแล้วกด <b>🔴 ออกงาน</b> ในแชต' : 'ถึงที่ทำงานกด <b>🟢 เข้างาน</b> ในแชต'}</div>

const A = {hol: Object.assign({}, D.hol || {}), work: new Set(D.work || []), payday: Object.assign({}, D.payday || {}), bonus: Object.assign({}, D.bonus || {})};
const ORIG = JSON.stringify(snap());
const st = {tab: 'cal', ym: today.slice(0, 7), name: 'วันหยุดบริษัท'};
function snap() { return {hol: A.hol, work: [...A.work].sort(), payday: A.payday, bonus: A.bonus}; }
const dirty = () => JSON.stringify(snap()) !== ORIG;
const we = s => [0, 6].includes(parse(s).getDay());
function calView() {
  const [y, m] = st.ym.split('-').map(Number), first = `${st.ym}-01`, n = new Date(y, m, 0).getDate();
  const minYm = LO.slice(0, 7), maxYm = st.ym < mkey(+today.slice(0, 4), +today.slice(5, 7) + 12);
  const days = []; for (let i = 1; i <= n; i++) days.push(`${st.ym}-${pad(i)}`);
  const inMonth = Object.entries(A.hol).filter(([d]) => d.startsWith(st.ym)).sort();
  const wk = [...A.work].filter(d => d.startsWith(st.ym)).sort();
  return `<div class="note">แตะ <b>วันธรรมดา</b> = เพิ่ม/ยกเลิกวันหยุด · แตะ <b>เสาร์-อาทิตย์</b> = ตั้ง/ยกเลิกเป็นวันทำงาน</div>
    <section class="panel"><div class="mrow" style="grid-template-columns:44px 1fr 44px"><button class="btn small" data-ym="-1" ${st.ym <= minYm ? 'disabled' : ''} aria-label="เดือนก่อน">◀</button><h2 style="justify-content:center;margin:0">${TH_MON[m - 1]} ${y + 543}</h2><button class="btn small" data-ym="1" ${maxYm ? '' : 'disabled'} aria-label="เดือนถัดไป">▶</button></div>
    <div class="field"><label for="hname">ชื่อวันหยุดที่จะเพิ่ม</label><input id="hname" style="text-align:left" value="${esc(st.name)}" maxlength="40"></div>
    <div class="cal">${TH_DOW.map(x => `<span class="h">${x}</span>`).join('')}${'<button class="off" tabindex="-1"></button>'.repeat(parse(first).getDay())}${days.map(s =>
      `<button data-day="${s}" ${s < LO ? 'disabled' : ''} class="${s === today ? 'today' : ''} ${A.hol[s] ? 'selh' : A.work.has(s) ? 'selw' : we(s) ? 'we' : ''}" aria-label="${thdl(s)}">${parse(s).getDate()}</button>`).join('')}</div>
    <div class="legend"><span><b style="background:var(--hol)"></b>วันหยุดบริษัท</span><span><b style="background:var(--good)"></b>เสาร์-อาทิตย์ที่ต้องทำงาน</span></div></section>
    <section class="panel"><h2>เดือนนี้ <small>${inMonth.length} วันหยุด · ${wk.length} วันทำงาน</small></h2>
      ${inMonth.length || wk.length ? `<div class="list">${inMonth.map(([d, nm]) => `<button data-day="${d}"><span>🔸 ${thd(d)}</span><span class="hint">${esc(nm)} ✕</span></button>`).join('')}${wk.map(d => `<button data-day="${d}"><span>🛠 ${thd(d)}</span><span class="hint">วันทำงาน ✕</span></button>`).join('')}</div>` : '<div class="hint">ไม่มี</div>'}</section>`;
}
function payView() {
  return `<div class="note">ปกติบอทคิดวันเงินออกเอง (สิ้นเดือนเลื่อนหนีวันหยุด) แก้เฉพาะเดือนที่บริษัทประกาศไม่ตรง</div><section class="panel"><h2>วันเงินเดือนออก</h2>`
    + KEYS.map(k => { const fix = A.payday[k];
      return `<div class="mrow"><span>${thk(k)}</span><input type="date" data-pd="${k}" value="${fix || AUTO[k] || ''}" min="${k}-01" max="${mkey(+k.slice(0, 4), +k.slice(5) + 1)}-10">
        ${fix ? `<button class="btn small" data-pdx="${k}">คืนค่าเดิม</button>` : '<span class="hint">อัตโนมัติ</span>'}</div>`; }).join('')
    + `</section>`;
}
function bonusView() {
  return `<div class="note">ใส่จำนวนเดือนของโบนัส (เช่น 1.5) ในรอบที่จ่าย ทุกคนจะเห็นบรรทัดโบนัสในสลิปรอบนั้น = เงินเดือนของแต่ละคน × จำนวนเดือน · เว้นว่าง = ไม่มี</div><section class="panel"><h2>โบนัส</h2>`
    + KEYS.map(k => `<div class="mrow"><span>${thk(k)}</span><input type="number" data-bn="${k}" inputmode="decimal" step="0.1" min="0" max="24" value="${A.bonus[k] || ''}" placeholder="—"><span class="hint">${A.bonus[k] ? 'เดือน' : ''}</span></div>`).join('')
    + `</section>`;
}
function render() {
  const T = [['cal', 'ปฏิทิน'], ['pay', 'วันเงินออก'], ['bonus', 'โบนัส']];
  document.getElementById('app').innerHTML = (PREVIEW ? `<div class="demo">🧪 ทดลอง · หน้าแอดมิน · กดบันทึกจะไม่ส่งเข้าบอท</div>` : '')
    + `<section class="panel" style="padding:10px 14px"><b>🛠 แอดมิน</b> <span class="hint">ตั้งค่าของบริษัท · ไม่มีข้อมูลของสมาชิกในหน้านี้</span></section>`
    + `<nav class="tabs" role="tablist">${T.map(([k, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab === k}">${n}</button>`).join('')}</nav>`
    + ({cal: calView, pay: payView, bonus: bonusView}[st.tab])();
  foot(dirty() ? '✅ บันทึกการเปลี่ยนแปลง' : '');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.tab) { st.tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.ym) { const [y, m] = st.ym.split('-').map(Number); st.ym = mkey(y, m + +b.dataset.ym); render(); return; }
  if (b.dataset.day) { const s = b.dataset.day;
    if (A.hol[s]) delete A.hol[s];
    else if (A.work.has(s)) A.work.delete(s);
    else if (we(s)) A.work.add(s);
    else A.hol[s] = (st.name || '').trim() || 'วันหยุดบริษัท';
    render(); return; }
  if (b.dataset.pdx) { delete A.payday[b.dataset.pdx]; render(); return; }
  if (b.id === 'go') send({a: 'adm', lo: LO, keys: KEYS, ...snap()});
});
document.addEventListener('input', e => { if (e.target.id === 'hname') st.name = e.target.value; });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pd) { const k = t.dataset.pd; if (!t.value || t.value === AUTO[k]) delete A.payday[k]; else A.payday[k] = t.value; render(); }
  if (t.dataset.bn) { const k = t.dataset.bn, v = parseFloat(t.value); if (v > 0 && v <= 24) A.bonus[k] = Math.round(v * 100) / 100; else delete A.bonus[k]; render(); }
});
render();
}

</script>
</body>
</html>
