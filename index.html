<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>สมุดเงินเดือน T/C:A</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Bai Jamjuree',system-ui,sans-serif; --body:'IBM Plex Sans Thai',system-ui,sans-serif;
  --bg:#f1f0ec; --surface:#fff; --surface-2:#f6f5f1; --fg:#1d1b17; --muted:#6a655b; --line:#ddd9cf;
  --accent:#9a4a12; --accent-ink:#fff; --accent-soft:#f6e6d8; --good:#2f7a3e; --bad:#b3261e; --warn:#8a5a00;
  --hero:#2a211a; --hero-fg:#fbf4ec; --hero-muted:#cbb9a6; --hero-line:#4a3b2f;
  --r15:#d4884a; --r2:#a8541a; --r3:#66290a; --night:#4b4f9a; --vac:#0f8f80; --per:#8a5ad8; --sick:#c9a000; --abs:#b3261e; --hol:#d0342c;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141210; --surface:#1d1a17; --surface-2:#24201c; --fg:#efe9e1; --muted:#a69d91; --line:#352f29;
    --accent:#f0a46a; --accent-ink:#2a1606; --accent-soft:#3a2617; --good:#7fd08f; --bad:#ff8f87; --warn:#f3c26b;
    --hero:#2b1f15; --hero-fg:#fbf4ec; --hero-muted:#c9b39c; --hero-line:#4a3a2c;
    --r15:#b05f25; --r2:#ec9c55; --r3:#ffe0c2; --night:#9da3ff; --vac:#3cc9b5; --per:#b08cff; --sick:#f2c94c; --abs:#ff8f87; --hol:#ff6b62}
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:14px 14px 110px;display:grid;gap:12px}
.demo{background:#fff4d6;color:#6b4a00;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;font-size:13px}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:16px;display:grid;gap:8px}
.eyebrow{font:600 14px var(--display);color:var(--hero-muted);display:flex;justify-content:space-between;gap:8px}
.hero-amount{font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums}
.hero-sub{font-size:13px;color:var(--hero-muted)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:10px}
.hero-stats span{display:block;font-size:12px;color:var(--hero-muted)}
.hero-stats b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 2px;min-height:46px;color:var(--muted);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h2{font:600 17px var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:400 13px var(--body);color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:14px}
.warn{color:var(--warn)} .bad{color:var(--bad)} .good{color:var(--good)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row span:last-child,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.line{border-top:1px solid var(--line);padding-top:8px}
.total{font:600 16px var(--display)}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.datebox{position:relative;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.step{display:flex;justify-content:space-between;align-items:center;gap:10px}
.step small{display:block;color:var(--muted);font-size:12px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;cursor:pointer}
.ctl output{min-width:56px;text-align:center;font:600 20px var(--display)}
.ctl output small{font:400 12px var(--body);color:var(--muted);margin-left:2px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:500}
.field input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2);text-align:right;font-variant-numeric:tabular-nums}
.field small{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.cal button.today{border:2px solid var(--accent)}
.cal button.we{color:var(--muted)}
.cal button.hol{color:var(--hol)}
.cal button.off{visibility:hidden}
.cal i{display:flex;gap:2px;height:6px}
.cal i b{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.quota{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quota div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.quota b{display:block;font:700 24px var(--display)}
.quota span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .t{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex}
.bar .t b{height:100%}
.xi{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;align-items:center}
.xi input{min-height:40px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface-2);min-width:0}
.xi input.amt{text-align:right}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:9}
.foot .btn{flex:1;max-width:320px}
.hidden{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div class="foot"><button class="btn danger hidden" id="del"></button><button class="btn primary" id="go"></button></div>
<script>
'use strict';
const tg = window.Telegram && Telegram.WebApp;
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_DOW = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_DOWL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const LV = {vac: 'พักร้อน', sick: 'ลาป่วย', per: 'ลากิจ', abs: 'ขาดงาน'};
const LVI = {vac: '🏖', sick: '🤒', per: '📝', abs: '❌'};
const QUOTA = {per: 3, sick: 30};
const pad = n => String(n).padStart(2, '0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoD(d); };
const thd = s => { const d = parse(s); return `${TH_DOW[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]}`; };
const thdl = s => { const d = parse(s); return `${TH_DOWL[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]}`; };
const thk = k => { const [y, m] = k.split('-').map(Number); return `${TH_MON[m - 1]} ${String(y + 543).slice(2)}`; };
const money = (v, dp = 2) => Number(v || 0).toLocaleString('en-US', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mkey = (y, m) => { const d = new Date(y, m - 1, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const keyOf = s => { const d = parse(s); return d.getDate() >= 16 ? mkey(d.getFullYear(), d.getMonth() + 2) : mkey(d.getFullYear(), d.getMonth() + 1); };
const period = k => { const [y, m] = k.split('-').map(Number); return [isoD(new Date(y, m - 2, 16)), isoD(new Date(y, m - 1, 15))]; };

/* ---------- ข้อมูลที่บอทแนบมากับปุ่ม (หลัง # ไม่ถูกส่งไปที่เว็บ) ---------- */
let D = null;
try {
  const h = location.hash.slice(1);
  if (h) { const b = atob(h.replace(/-/g, '+').replace(/_/g, '/')); D = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))); }
} catch (e) { D = null; }
const DEMO = !D;
if (DEMO) D = demoData();
const today = D.t || isoD(new Date());
const S = Object.assign({sal: 0, dil: 1000, sh: 220, inc: 0, sso: 0, tax: 0, oth: 0, vq: 13, auto: 1}, D.s || {});
const OT = D.o || {};                 // {iso: [h1.5, h2, h3, กะดึก]}
const LVS = D.l || {};                // {iso: [ประเภท, 1|0.5]}
const HOL = new Set(D.h || []);
const X = Object.assign({inc: [], ded: []}, D.x || {});   // รายการพิเศษรอบนี้ [[ชื่อ, ยอด]]
const HIST = D.hist || [];            // [[รอบ, สุทธิ, ชม.1.5, ชม.2, ชม.3, คืนกะดึก]] เก่า→ใหม่
const KEY = D.k || keyOf(today);
const [PA, PB] = period(KEY);
const PAY = D.pay || '';
const rate = S.sal ? S.sal / 21 / 8.5 : 0;

const st = {tab: ['home', 'ot', 'leave', 'hist', 'set'].includes(new URLSearchParams(location.search).get('m')) ? new URLSearchParams(location.search).get('m') : 'home',
  d: today, h: [0, 0, 0], n: false, t: '', f: 1, xi: X.inc.map(r => r.slice()), xd: X.ded.map(r => r.slice())};
function loadDay() {
  const o = OT[st.d]; st.h = o ? [o[0], o[1], o[2]] : [0, 0, 0]; st.n = !!(o && o[3]);
  const l = LVS[st.d]; st.t = l ? l[0] : ''; st.f = l ? l[1] : 1;
}
loadDay();
const dayTag = s => { const w = parse(s).getDay(); return HOL.has(s) ? 'วันหยุดบริษัท' : (w === 0 || w === 6) ? 'วันเสาร์-อาทิตย์' : ''; };

/* ---------- คำนวณสลิปรอบนี้ (สูตรเดียวกับบอท) ---------- */
function slip() {
  let h15 = 0, h2 = 0, h3 = 0, nights = 0;
  for (const [d, v] of Object.entries(OT)) if (d >= PA && d <= PB) { h15 += v[0]; h2 += v[1]; h3 += v[2]; nights += v[3] ? 1 : 0; }
  const ot = rate * (1.5 * h15 + 2 * h2 + 3 * h3);
  const [y, m] = KEY.split('-').map(Number), pm = mkey(y, m - 1);                // เบี้ยขยันดูเดือนปฏิทินก่อนเดือนที่จ่าย
  const lost = [...new Set(Object.entries(LVS).filter(([d, v]) => d.startsWith(pm) && v[0] !== 'vac').map(([, v]) => LV[v[0]]))];
  const absd = Object.entries(LVS).filter(([d, v]) => d >= PA && d <= PB && v[0] === 'abs').reduce((a, [, v]) => a + v[1], 0);
  const xi = st.xi.filter(r => +r[1]), xd = st.xd.filter(r => +r[1]);
  const inc = [['เงินเดือน', S.sal], ['โอที', ot], ['ค่ากะดึก', nights * S.sh], ['เบี้ยขยัน', lost.length ? 0 : S.dil], ['รายรับประจำอื่น ๆ', S.inc]].concat(xi.map(r => [r[0] || 'รายรับพิเศษ', +r[1], 1]));
  const ded = [['ภาษี (ตามสลิป)', S.tax], ['ประกันสังคม', S.sso], ['หักประจำอื่น ๆ', S.oth], ['ขาดงาน (ไม่ได้รับเงิน)', S.sal / 30 * absd]].concat(xd.map(r => [r[0] || 'รายการหักพิเศษ', +r[1], 1]));
  const ti = inc.reduce((a, r) => a + r[1], 0), td = ded.reduce((a, r) => a + r[1], 0);
  return {inc, ded, ti, td, net: ti - td, ot, h: [h15, h2, h3], nights, lost, pm};
}

/* ---------- หน้า ---------- */
function hero(p) {
  return `<section class="hero">
    <div class="eyebrow"><span>สลิป ${thk(KEY)} (ประมาณ)</span><span>${PAY ? 'เงินออก ' + thd(PAY) : ''}</span></div>
    <div class="hero-amount">฿${money(p.net)}</div>
    <div class="hero-sub">รอบ ${thd(PA)} – ${thd(PB)}${S.sal ? '' : ' · ยังไม่ได้ใส่เงินเดือน'}</div>
    <div class="hero-stats"><div><span>โอที</span><b>฿${money(p.ot, 0)}</b></div><div><span>ชั่วโมงโอที</span><b>${p.h[0] + p.h[1] + p.h[2]} ชม.</b></div><div><span>เบี้ยขยัน</span><b class="${p.lost.length ? 'bad' : ''}" style="${p.lost.length ? 'color:#ffb4ab' : ''}">${p.lost.length ? 'ไม่ได้' : 'ได้'}</b></div></div>
  </section>`;
}
function calendar() {
  const start = parse(PA), days = [];
  for (let s = PA; s <= PB; s = add(s, 1)) days.push(s);
  const pre = start.getDay();
  const dot = s => { const o = OT[s], l = LVS[s], b = [];
    if (o) { if (o[0]) b.push('var(--r15)'); if (o[1]) b.push('var(--r2)'); if (o[2]) b.push('var(--r3)'); if (o[3]) b.push('var(--night)'); }
    if (l) b.push(`var(--${l[0]})`);
    return `<i>${b.map(c => `<b style="background:${c}"></b>`).join('')}</i>`; };
  return `<section class="panel"><h2>ปฏิทินรอบนี้ <small>แตะวันเพื่อลงโอที/ลา</small></h2>
    <div class="cal">${TH_DOW.map(x => `<span class="h">${x}</span>`).join('')}${'<button class="off" tabindex="-1"></button>'.repeat(pre)}${days.map(s => { const w = parse(s).getDay();
      return `<button data-go="${s}" class="${s === today ? 'today' : ''} ${HOL.has(s) ? 'hol' : (w === 0 || w === 6) ? 'we' : ''}" aria-label="${thdl(s)}">${parse(s).getDate()}${dot(s)}</button>`; }).join('')}</div>
    <div class="legend"><span><b style="background:var(--r15)"></b>โอที 1.5</span><span><b style="background:var(--r2)"></b>2 เท่า</span><span><b style="background:var(--r3)"></b>3 เท่า</span><span><b style="background:var(--night)"></b>กะดึก</span><span><b style="background:var(--vac)"></b>พักร้อน</span><span><b style="background:var(--sick)"></b>ป่วย</span><span><b style="background:var(--per)"></b>กิจ</span><span><b style="background:var(--abs)"></b>ขาด</span></div>
  </section>`;
}
function homeView(p) {
  const rows = (a) => a.filter(r => r[1] || r[0] === 'เงินเดือน').map(r => `<div class="row"><span>${esc(r[0])}${r[2] ? ' <small class="hint">พิเศษ</small>' : ''}</span><span>${money(r[1])}</span></div>`).join('');
  const xrow = (k, r, i) => `<div class="xi"><input data-x="${k}" data-i="${i}" data-f="0" value="${esc(r[0] || '')}" placeholder="ชื่อรายการ"><input class="amt" data-x="${k}" data-i="${i}" data-f="1" inputmode="decimal" value="${r[1] || ''}" placeholder="0.00"><button class="btn small" data-xdel="${k}" data-i="${i}" aria-label="ลบ">✕</button></div>`;
  return hero(p)
    + (p.lost.length ? `<div class="note">⚠️ เบี้ยขยันรอบนี้ 0 เพราะเดือน ${TH_MON[+p.pm.slice(5) - 1]} มี${p.lost.join(', ')}</div>` : '')
    + `<section class="panel"><h2>รายรับ <small>${money(p.ti)}</small></h2>${rows(p.inc)}
      ${p.h.some(x => x) ? `<div class="hint">โอที 1.5×${p.h[0]} · 2×${p.h[1]} · 3×${p.h[2]} ชม.${rate ? ' · ชม.ละ ' + money(rate) : ''}${p.nights ? ' · กะดึก ' + p.nights + ' คืน' : ''}</div>` : ''}</section>`
    + `<section class="panel"><h2>รายการหัก <small>${money(p.td)}</small></h2>${rows(p.ded)}
      <div class="row line total"><span>สุทธิ (ประมาณ)</span><span>${money(p.net)}</span></div></section>`
    + `<section class="panel"><h2>รายการพิเศษรอบนี้ <small>เฉพาะรอบ ${thk(KEY)}</small></h2>
      <div class="hint">เช่น ค่าคอม ค่าเที่ยว เงินคืน · หักค่าชุด หักเงินกู้งวดเดียว</div>
      <b style="font-size:14px">รายรับพิเศษ</b>${st.xi.map((r, i) => xrow('i', r, i)).join('')}<button class="btn small" data-xadd="i">+ เพิ่มรายรับพิเศษ</button>
      <b style="font-size:14px">รายการหักพิเศษ</b>${st.xd.map((r, i) => xrow('d', r, i)).join('')}<button class="btn small" data-xadd="d">+ เพิ่มรายการหัก</button></section>`
    + calendar();
}
function dateCard() {
  const y = add(today, -1), tag = dayTag(st.d);
  return `<section class="panel"><div class="chips"><button class="chip ${st.d === today ? 'on' : ''}" data-d="${today}">วันนี้</button><button class="chip ${st.d === y ? 'on' : ''}" data-d="${y}">เมื่อวาน</button></div>
    <label class="datebox"><span>📅 ${thdl(st.d)}</span><small class="hint">เปลี่ยนวัน ▾</small><input type="date" id="pick" value="${st.d}" min="${add(PA, -45)}" max="${add(today, 60)}"></label>
    ${tag ? `<div class="hint">🔸 ${tag}${st.tab === 'ot' ? ' — มักเป็นโอที 2 เท่า / 3 เท่า' : ''}</div>` : ''}
    ${st.d < PA || st.d > PB ? `<div class="hint">วันนี้อยู่รอบ ${thk(keyOf(st.d))}</div>` : ''}</section>`;
}
function otView() {
  const day = rate * (1.5 * st.h[0] + 2 * st.h[1] + 3 * st.h[2]);
  const row = (i, name, x) => `<div class="step"><div><b>${name}</b><small>${rate ? 'ชม.ละ ' + money(rate * x) + ' บาท' : ''}</small></div>
    <div class="ctl"><button data-h="${i}" data-v="-0.5" aria-label="ลด">−</button><output>${st.h[i]}<small>ชม.</small></output><button data-h="${i}" data-v="0.5" aria-label="เพิ่ม">＋</button></div></div>`;
  return (S.sal ? '' : `<div class="note">ยังไม่ได้ใส่เงินเดือน ระบบจึงคิดเป็นเงินไม่ได้ กด <b>⚙️ ตั้งค่า</b> ก่อน</div>`) + dateCard()
    + (OT[st.d] ? `<div class="note">วันนี้มีบันทึกไว้แล้ว แก้ตัวเลขแล้วกดบันทึกได้เลย</div>` : '')
    + `<section class="panel"><div class="hint">กด ＋ เพิ่มทีละครึ่งชั่วโมง</div>${row(0, 'โอที 1.5 เท่า', 1.5)}${row(1, 'โอที 2 เท่า', 2)}${row(2, 'โอที 3 เท่า', 3)}
      <label class="toggle line"><span><b>🌙 เข้ากะดึกวันนี้</b><small class="hint" style="display:block">ได้ค่ากะ ${money(S.sh)} บาท</small></span><input type="checkbox" id="night" ${st.n ? 'checked' : ''}></label></section>`
    + (rate ? `<section class="panel"><div class="row"><span>วันนี้ได้ประมาณ</span><span class="total">${money(day + (st.n ? S.sh : 0))} บาท</span></div></section>` : '');
}
function used(year) { const u = {vac: 0, sick: 0, per: 0, abs: 0}; for (const [d, v] of Object.entries(LVS)) if (d.startsWith(year) && v[0] in u) u[v[0]] += v[1]; return u; }
function leaveView() {
  const U = used(st.d.slice(0, 4)), lose = st.t && st.t !== 'vac';
  const list = Object.entries(LVS).filter(([d]) => d.startsWith(st.d.slice(0, 4))).sort().reverse();
  return dateCard()
    + (LVS[st.d] ? `<div class="note">วันนี้บันทึก <b>${LV[LVS[st.d][0]]}</b>${LVS[st.d][1] === 0.5 ? ' ครึ่งวัน' : ''} ไว้แล้ว</div>` : '')
    + `<section class="panel"><h2>ลาแบบไหน</h2><div class="chips">${Object.keys(LV).map(k => `<button class="chip ${st.t === k ? 'on' : ''}" data-t="${k}">${LVI[k]} ${LV[k]}</button>`).join('')}</div>
      <div class="chips"><button class="chip ${st.f === 1 ? 'on' : ''}" data-f="1">เต็มวัน</button><button class="chip ${st.f === 0.5 ? 'on' : ''}" data-f="0.5">ครึ่งวัน</button></div></section>`
    + (lose ? `<div class="note">⚠️ ${LV[st.t]} = สลิปเดือนถัดไปไม่ได้เบี้ยขยัน${st.t === 'abs' ? ' และหักเงินวันนั้น' : ''}</div>` : '')
    + `<section class="panel"><h2>วันลาคงเหลือปี ${+st.d.slice(0, 4) + 543}</h2><div class="quota">
      <div><b>${S.vq - U.vac}</b><span>พักร้อนเหลือ<br>จาก ${S.vq} วัน</span></div><div><b>${QUOTA.per - U.per}</b><span>ลากิจเหลือ<br>จาก ${QUOTA.per} วัน</span></div><div><b>${U.sick}</b><span>ลาป่วยใช้ไป<br>จาก ${QUOTA.sick} วัน</span></div></div>
      ${U.abs ? `<div class="hint bad">ขาดงาน ${U.abs} วัน</div>` : ''}
      ${list.length ? `<div class="line" style="display:grid;gap:4px">${list.slice(0, 12).map(([d, v]) => `<div class="row"><span>${LVI[v[0]]} ${thd(d)}</span><span class="hint">${LV[v[0]]}${v[1] === 0.5 ? ' ครึ่งวัน' : ''}</span></div>`).join('')}</div>` : '<div class="hint">ยังไม่มีวันลาในปีนี้</div>'}</section>`;
}
function histView(p) {
  const rows = HIST.concat([[KEY, p.net, p.h[0], p.h[1], p.h[2], p.nights, 1]]).slice(-12);
  const mx = Math.max(1, ...rows.map(r => r[1])), mh = Math.max(1, ...rows.map(r => r[2] + r[3] + r[4]));
  const yr = String(new Date().getFullYear()), ys = rows.filter(r => r[0].startsWith(yr));
  const sum = (a, f) => a.reduce((s, r) => s + f(r), 0);
  return `<section class="panel"><h2>เงินสุทธิแต่ละรอบ <small>${rows.length} รอบล่าสุด</small></h2><div class="bars">${rows.slice().reverse().map(r => `<div class="bar"><span>${thk(r[0])}${r[6] ? ' •' : ''}</span><span class="t"><b style="width:${r[1] / mx * 100}%;background:var(--accent)"></b></span><span class="num">${money(r[1], 0)}</span></div>`).join('')}</div>
      <div class="hint">• = รอบนี้ (ยังเปลี่ยนได้)</div></section>`
    + `<section class="panel"><h2>ชั่วโมงโอที <small>6 รอบล่าสุด</small></h2><div class="bars">${rows.slice(-6).reverse().map(r => { const t = r[2] + r[3] + r[4];
      return `<div class="bar"><span>${thk(r[0])}</span><span class="t">${[[r[2], 'var(--r15)'], [r[3], 'var(--r2)'], [r[4], 'var(--r3)']].map(([v, c]) => `<b style="width:${v / mh * 100}%;background:${c}"></b>`).join('')}</span><span class="num">${t} ชม.</span></div>`; }).join('')}</div>
      <div class="legend"><span><b style="background:var(--r15)"></b>1.5 เท่า</span><span><b style="background:var(--r2)"></b>2 เท่า</span><span><b style="background:var(--r3)"></b>3 เท่า</span></div></section>`
    + `<section class="panel"><h2>สรุปปี ${+yr + 543} <small>${ys.length} รอบ</small></h2>
      <div class="row"><span>เงินสุทธิรวม</span><span>${money(sum(ys, r => r[1]))}</span></div>
      <div class="row"><span>ชั่วโมงโอทีรวม</span><span>${sum(ys, r => r[2] + r[3] + r[4])} ชม.</span></div>
      <div class="row"><span>กะดึกรวม</span><span>${sum(ys, r => r[5])} คืน</span></div>
      <div class="row"><span>เฉลี่ยต่อรอบ</span><span>${money(ys.length ? sum(ys, r => r[1]) / ys.length : 0)}</span></div></section>`;
}
const FIELDS = [['sal', 'เงินเดือน', 'ดูในสลิปบริษัท ช่อง Salary'], ['dil', 'เบี้ยขยัน', 'ปกติ 1,000 ถ้าได้ไม่เท่านี้ให้แก้'], ['sh', 'ค่ากะดึก (ต่อคืน)', 'ปกติ 220'],
  ['inc', 'รายรับประจำอื่น ๆ', 'เช่น ค่าตำแหน่ง ค่าครองชีพ รวมกัน (ไม่มีใส่ 0)'], ['sso', 'ประกันสังคม', 'ช่อง Social Security ในสลิป'],
  ['tax', 'ภาษี', 'ช่อง W/H Tax ในสลิป (ไม่มีใส่ 0)'], ['oth', 'หักประจำอื่น ๆ', 'เช่น ฌาปนกิจ เงินกู้ ประกันกลุ่ม'], ['vq', 'วันพักร้อนต่อปี', 'ปกติ 13 วัน']];
function setView() {
  return `<div class="note">ทำครั้งเดียว ดูตัวเลขจาก <b>สลิปเงินเดือนของบริษัท</b> ใบล่าสุด</div><section class="panel">`
    + FIELDS.map(([k, n, h]) => `<div class="field"><label for="f_${k}">${n}</label><input id="f_${k}" inputmode="decimal" value="${S[k] ? Number(S[k]).toLocaleString('en-US') : (k === 'sal' ? '' : '0')}" placeholder="0"><small>${h}</small></div>`).join('')
    + `<label class="toggle line"><span><b>🧾 ส่งสลิปให้ทุกวันที่ 16</b><small class="hint" style="display:block">บอทส่งสรุปรอบที่ปิดแล้วให้ในแชท</small></span><input type="checkbox" id="auto" ${S.auto ? 'checked' : ''}></label></section>`;
}
function render() {
  const p = slip();
  const T = {home: '🏠 รอบนี้', ot: '⏱ โอที', leave: '🏖 ลา', hist: '📈 ย้อนหลัง', set: '⚙️ ตั้งค่า'};
  document.getElementById('app').innerHTML = (DEMO ? `<div class="demo">🧪 ตัวอย่าง · ตัวเลขสมมติ · กดบันทึกจะไม่ส่งเข้าบอท</div>` : '')
    + `<nav class="tabs" role="tablist">${Object.entries(T).map(([k, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab === k}">${n}</button>`).join('')}</nav>`
    + ({home: homeView, ot: otView, leave: leaveView, hist: histView, set: setView}[st.tab])(p)
    + (!DEMO && !inTg() ? `<p class="hint bad">เปิดหน้านี้จากปุ่มในแชทบอทผู้ช่วยเท่านั้น ถึงจะบันทึกได้</p>` : '');
  const del = document.getElementById('del'), go = document.getElementById('go'), foot = go.parentElement;
  del.classList.add('hidden'); go.disabled = false; foot.classList.remove('hidden');
  if (st.tab === 'ot') { go.textContent = '✅ บันทึกโอที'; if (OT[st.d]) { del.textContent = '🗑 ลบ'; del.classList.remove('hidden'); } }
  else if (st.tab === 'leave') { go.textContent = st.t ? `✅ บันทึก${LV[st.t]}` : 'เลือกประเภทการลาก่อน'; go.disabled = !st.t; if (LVS[st.d]) { del.textContent = '🗑 ลบ'; del.classList.remove('hidden'); } }
  else if (st.tab === 'set') go.textContent = '✅ บันทึกตั้งค่า';
  else if (st.tab === 'home') { const ch = JSON.stringify([st.xi, st.xd]) !== JSON.stringify([X.inc, X.ded]); go.textContent = '✅ บันทึกรายการพิเศษ'; if (!ch) foot.classList.add('hidden'); }
  else foot.classList.add('hidden');
}
/* เปิดจากปุ่มคีย์บอร์ดของบอท → initData ว่างเป็นปกติ จึงเช็คแค่ว่าอยู่ใน Telegram */
const inTg = () => !!(tg && typeof tg.sendData === 'function' && tg.platform && tg.platform !== 'unknown');
function send(obj) {
  if (DEMO) { alert('ตัวอย่าง: จะส่งเข้าบอทเป็น\n' + JSON.stringify(obj)); return; }
  if (!inTg()) { alert('เปิดจากปุ่มในแชทบอทผู้ช่วยก่อนนะครับ'); return; }
  try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  try { tg.sendData(JSON.stringify(obj)); }
  catch (e) { alert('ส่งไม่ได้ · เปิดจากปุ่มคีย์บอร์ดด้านล่างแชทส่วนตัวกับบอท (ไม่ใช่ลิงก์หรือปุ่ม Menu) แล้วลองใหม่'); }
}
const cleanX = a => a.map(r => [String(r[0] || '').trim().slice(0, 40), Math.round((parseFloat(String(r[1]).replace(/,/g, '')) || 0) * 100) / 100]).filter(r => r[1] > 0);
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { st.tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.go) { st.d = b.dataset.go; loadDay(); st.tab = LVS[st.d] && !OT[st.d] ? 'leave' : 'ot'; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.d) { st.d = b.dataset.d; loadDay(); render(); return; }
  if (b.dataset.h) { const i = +b.dataset.h; st.h[i] = Math.max(0, Math.min(16, st.h[i] + +b.dataset.v)); render(); return; }
  if (b.dataset.t) { st.t = b.dataset.t; render(); return; }
  if (b.dataset.f) { st.f = +b.dataset.f; render(); return; }
  if (b.dataset.xadd) { (b.dataset.xadd === 'i' ? st.xi : st.xd).push(['', '']); render(); return; }
  if (b.dataset.xdel) { (b.dataset.xdel === 'i' ? st.xi : st.xd).splice(+b.dataset.i, 1); render(); return; }
  if (b.id === 'go') {
    if (st.tab === 'ot') { if (!st.h.some(x => x) && !st.n) { alert('ยังไม่ได้ใส่ชั่วโมงโอที กดปุ่ม ＋ ก่อน'); return; } send({a: 'ot', d: st.d, h: st.h, n: st.n ? 1 : 0}); }
    else if (st.tab === 'leave') { if (st.t) send({a: 'lv', d: st.d, t: st.t, f: st.f}); }
    else if (st.tab === 'home') send({a: 'x', k: KEY, inc: cleanX(st.xi), ded: cleanX(st.xd)});
    else if (st.tab === 'set') {
      const s = {}; for (const [k, n] of FIELDS) { const v = parseFloat((document.getElementById('f_' + k).value || '0').replace(/,/g, '')); if (!isFinite(v) || v < 0) { alert('ช่อง ' + n + ' ใส่ตัวเลขให้ถูก'); return; } s[k] = v; }
      if (!s.sal) { alert('ใส่เงินเดือนก่อนนะครับ'); return; }
      s.auto = document.getElementById('auto').checked ? 1 : 0;
      send({a: 'set', s});
    }
  }
  if (b.id === 'del') { if (!confirm('ลบรายการของ ' + thd(st.d) + ' ?')) return; send(st.tab === 'ot' ? {a: 'ot', d: st.d, h: [0, 0, 0], n: 0} : {a: 'lv', d: st.d, t: ''}); }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.x) { (t.dataset.x === 'i' ? st.xi : st.xd)[+t.dataset.i][+t.dataset.f] = t.value; const go = document.getElementById('go'), ch = JSON.stringify([cleanX(st.xi), cleanX(st.xd)]) !== JSON.stringify([X.inc, X.ded]); go.textContent = '✅ บันทึกรายการพิเศษ'; go.disabled = false; go.parentElement.classList.toggle('hidden', !ch); } });
document.addEventListener('change', e => {
  if (e.target.id === 'pick' && e.target.value) { st.d = e.target.value; loadDay(); render(); }
  if (e.target.id === 'night') { st.n = e.target.checked; render(); }
  if (e.target.dataset.x) setTimeout(() => { const a = document.activeElement; if (!(a && a.dataset && a.dataset.x)) render(); }, 0);   // ยังพิมพ์ช่องพิเศษอื่นอยู่ → ยังไม่วาดใหม่ (ไม่ให้หลุดโฟกัส)
});

/* ---------- ข้อมูลตัวอย่าง (เปิดนอก Telegram) ---------- */
function demoData() {
  const t = isoD(new Date()), k = keyOf(t), [a, b] = period(k), o = {}, l = {};
  const days = []; for (let s = a; s <= (t < b ? t : b); s = add(s, 1)) days.push(s);
  days.forEach((s, i) => { const w = parse(s).getDay(); if (w === 6) o[s] = [0, 8, 2, 0]; else if (w > 0 && i % 3 === 0) o[s] = [3, 0, 0, i % 2]; });
  const [y, m] = k.split('-').map(Number);
  l[isoD(new Date(y, 0, 12))] = ['vac', 1]; l[isoD(new Date(y, 2, 3))] = ['vac', 1];
  const p3 = isoD(new Date(y, m - 4, 9)); l[p3] = ['sick', 1];
  const hist = []; for (let i = 7; i >= 1; i--) { const kk = mkey(y, m - i); hist.push([kk, 21000 + (i * 1337) % 4200, 18 + (i * 5) % 14, 16 - (i * 3) % 9, (i % 3) * 2, i % 4]); }
  return {t, k, pay: isoD(new Date(y, m, -2)), s: {sal: 15000, dil: 1000, sh: 220, inc: 500, sso: 750, tax: 0, oth: 100, vq: 13, auto: 1},
    o, l, h: [], x: {inc: [['ค่าคอม', 800]], ded: []}, hist};
}
if (tg) { tg.ready(); tg.expand(); }
render();
</script>
